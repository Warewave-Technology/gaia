name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.sum is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: shellcheck, qemu-utils (internal/nbd is tested against qemu-nbd)
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck qemu-utils
      - run: make check
        env:
          GAIA_REQUIRE_QEMU: "1"
