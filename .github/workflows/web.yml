name: web

on:
  push:
    paths: ["web/**", "internal/server/openapi.json", "Makefile", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "internal/server/openapi.json", "Makefile", ".github/workflows/web.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-drift
      - run: make web-test
