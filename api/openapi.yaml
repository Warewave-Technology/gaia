openapi: 3.1.0
info:
  title: Gaia API
  version: v1
  description: |
    Gaia's API. The CLI and the web interface are its clients (design 11.1).

    Every endpoint needs a session unless it says otherwise: the browser's
    gaia_session cookie, or a CLI access token as a bearer token. A request
    that changes something with the cookie must carry `X-Gaia-Request: 1`.
    A contract the caller may not see is shown by name only (design 11.4):
    lists mark it `restricted`, and its details answer 403.
    Without an AuthConfig in its catalog the server runs open, on loopback
    addresses only.
servers:
  - url: http://127.0.0.1:8080
security:
  - session: []
  - bearer: []
paths:
  /api/v1/runs:
    get:
      summary: List runs, newest first
      operationId: listRuns
      parameters:
        - { name: contract, in: query, schema: { type: string }, description: Only runs of this contract }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200": { description: Runs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/runs/{id}:
    get:
      summary: A run with its stages and its record
      operationId: getRun
      parameters: [{ $ref: "#/components/parameters/RunID" }]
      responses:
        "200": { description: The run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{id}/cancel:
    post:
      summary: Cancel a queued or running run
      description: A queued run never starts; a running one stops where it is and is recorded as cancelled.
      operationId: cancelRun
      parameters: [{ $ref: "#/components/parameters/RunID" }]
      responses:
        "202": { description: Cancelling, content: { application/json: { schema: { type: object, properties: { status: { type: string, const: cancelling } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The run has already finished, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/runs/{id}/events:
    get:
      summary: A run's events after a sequence number
      operationId: listEvents
      parameters:
        - { $ref: "#/components/parameters/RunID" }
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        "200": { description: Events in order, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{id}/events/stream:
    get:
      summary: A run's events as server-sent events
      description: |
        Sends the events after Last-Event-ID (or ?after), then each new one as
        it is written. SSE event names are "log" (output lines) and "ansible";
        the id is the event's sequence number and the data an Event. When the
        run has finished and every event is sent, an "end" event carries
        {"status": …} and the stream closes. Idle streams get a comment every
        15 seconds.
      operationId: streamEvents
      parameters:
        - { $ref: "#/components/parameters/RunID" }
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: integer } }
      responses:
        "200": { description: The stream, content: { text/event-stream: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{id}/record:
    get:
      summary: A run's immutable record
      operationId: getRecord
      parameters: [{ $ref: "#/components/parameters/RunID" }]
      responses:
        "200":
          description: The record and its place in the chain
          content:
            application/json:
              schema:
                type: object
                required: [seq, recordHash, prevHash, body]
                properties:
                  seq: { type: integer }
                  recordHash: { type: string }
                  prevHash: { type: string }
                  archived: { type: string, description: Where the archived copy is }
                  body: { type: object, description: The record (design 10.1) }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/records/verify:
    get:
      summary: Check the hash chain of every run record
      operationId: verifyRecords
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema:
                type: object
                required: [records, intact]
                properties:
                  records: { type: integer, description: Records checked before the first broken one }
                  intact: { type: boolean }
                  broken:
                    type: object
                    properties: { seq: { type: integer }, run: { type: string }, reason: { type: string } }
  /api/v1/contracts:
    get:
      summary: Contracts Gaia has servers or runs for
      operationId: listContracts
      responses:
        "200": { description: Contracts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ContractSummary" } } } } }
  /api/v1/contracts/{name}:
    get:
      summary: A contract's servers and recent runs
      operationId: getContract
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The contract, content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/changes:
    get:
      summary: Changes, newest first (design 7.6)
      operationId: listChanges
      parameters:
        - { name: contract, in: query, schema: { type: string } }
        - { name: open, in: query, schema: { type: boolean }, description: Only pending, approved and running ones }
        - { name: commit, in: query, schema: { type: string }, description: Only changes that bring this commit (one commit's changes across contracts) }
        - { name: awaiting, in: query, schema: { type: string, enum: [me] }, description: Only open changes that wait for an approval the caller may give }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200": { description: Changes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Change" } } } } }
  /api/v1/drift:
    get:
      summary: Live drift, where the systems are not what was applied (design 7.5)
      operationId: listDrift
      parameters:
        - { name: contract, in: query, schema: { type: string } }
      responses:
        "200": { description: Drift reports, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Drift" } } } } }
  /api/v1/discovery:
    get:
      summary: The latest discovery report, what the hypervisors and monitoring have next to Gaia's records (operator)
      operationId: getDiscovery
      responses:
        "200": { description: The report, content: { application/json: { schema: { $ref: "#/components/schemas/Discovery" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Ask for a discovery report now, instead of at the daily scan (operator)
      operationId: requestDiscovery
      responses:
        "202": { description: Requested; the report comes within a minute or two }
  /api/v1/contracts/{name}/reconcile:
    post:
      summary: Open a change that applies the contract's applied plan again, putting drift right; the owner approves it (operator)
      operationId: reconcileContract
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: The change, content: { application/json: { schema: { type: object, properties: { change: { type: string } } } } } }
        "409": { description: Nothing applied to go back to, or a change is coming, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/changes/{id}:
    get:
      summary: A change with its plan, requirements, commits and approvals
      operationId: getChange
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The change, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/changes/{id}/retry:
    post:
      summary: Open a new change for a failed or cancelled one whose plan is still current (operator)
      operationId: retryChange
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: The new change, content: { application/json: { schema: { type: object, properties: { change: { type: string } } } } } }
        "409": { description: Not retryable, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/changes/approve:
    post:
      summary: Approve several changes at once, e.g. one commit's changes across owners (platform-admin)
      description: Each change is decided on its own, as by POST /api/v1/changes/{id}/approve; the answer says how each went.
      operationId: approveChanges
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes: { type: array, maxItems: 100, items: { type: object, required: [id, planHash], properties: { id: { type: string }, planHash: { type: string } } } }
                comment: { type: string }
      responses:
        "200":
          description: One result per change
          content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string }, status: { type: string }, error: { type: string } } } } } }
        "403": { description: "Confirm with a passkey first (stepUp: true)", content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/changes/{id}/diff:
    get:
      summary: What changed in Git for the change's contract since it was last applied
      description: The contract and every object it refers to (directly or through others), and the Policy and Platform; each as a unified diff of its YAML.
      operationId: changeDiff
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The changed objects, the contract first
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, description: The applied snapshot's label; empty if the contract was never applied }
                  to: { type: string, description: The change's snapshot label }
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        name: { type: string }
                        file: { type: string }
                        status: { type: string, enum: [added, modified, removed] }
                        diff: { type: string, description: Unified diff with three lines of context }
        "403": { description: The caller sees the contract's name only }
        "404": { description: No such change }
  /api/v1/changes/{id}/notifications:
    get:
      summary: The notifications sent, or being sent, about a change
      operationId: changeNotifications
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    trigger: { type: string }
                    channel: { type: string }
                    recipient: { type: string, description: "team/<name>/<n> or user/<id>" }
                    status: { type: string, enum: [pending, sent, failed] }
                    attempts: { type: integer }
                    lastError: { type: string }
                    createdAt: { type: string, format: date-time }
                    sentAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/changes/{id}/approve:
    post:
      summary: Approve a change for the plan you saw (design 7.6); needs a recent passkey or MFA
      description: Only the people the approval gate lists may decide, and never someone who signed the change's commits.
      operationId: approveChange
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/Decision" }
      responses:
        "200": { description: The change after the decision, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "400": { description: No plan hash, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Not an approver, or confirm with a passkey first (stepUp: true)", content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Closed, decided already, needs no approval, or the plan is not the one you saw", content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/changes/{id}/reject:
    post:
      summary: Reject a change, with a reason; it closes the change
      operationId: rejectChange
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/Decision" }
      responses:
        "200": { description: The rejected change, content: { application/json: { schema: { $ref: "#/components/schemas/Change" } } } }
        "400": { description: No plan hash or no reason, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Not an approver, or confirm first, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Closed, decided already or another plan, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/commits/{sha}/revert:
    post:
      summary: Have Gaia write the revert of a commit (design 7.6)
      description: >-
        Gaia writes a commit signed with its key on top of the followed branch, naming
        the caller in a Gaia-Requested-By trailer. Its changes wait for their requirements
        like any, and the caller may not approve them. Operators may revert any commit;
        others only one whose changes were all to contracts they see in full.
      operationId: revertCommit
      parameters: [{ name: sha, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{40}$" } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [repo], properties: { repo: { type: string, description: "platform, or a git provider's name" } } } } } }
      responses:
        "201": { description: Written, content: { application/json: { schema: { type: object, properties: { commit: { type: string }, reverts: { type: string } } } } } }
        "400": { description: Not a full SHA or no repo, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Not an operator nor the owner of what the commit changed, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: No such repository or commit, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Later commits changed the same files, a merge commit, or the branch moved", content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: gaia server has no --signing-key, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/preview:
    get:
      summary: Plan a ref Gaia does not follow, against what is applied (design 7.6)
      description: >-
        A branch, refs/tags/…, pull/N (a GitHub pull request) or a full commit SHA of a followed
        platform or contract repository; the other repositories stay at their heads. Nothing is
        applied and no change is opened. Contracts the caller may not see are named only.
      operationId: preview
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string } }
        - { name: repo, in: query, schema: { type: string, default: platform } }
      responses:
        "200":
          description: Each contract's plan at the ref; error says why it does not load or plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  repo: { type: string }
                  ref: { type: string }
                  commit: { type: string }
                  label: { type: string }
                  error: { type: string }
                  contracts:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        changed: { type: boolean }
                        planHash: { type: string }
                        appliedPlanHash: { type: string }
                        plan: { type: object }
                        removed: { type: boolean }
                        restricted: { type: boolean }
        "404": { description: No such followed repository, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: The ref cannot be fetched, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/operations:
    get:
      summary: Operations and how they went per server (operator; design 6.4)
      operationId: listOperations
      responses:
        "200":
          description: The ones Gaia took up, newest first, then the repository's that it has not, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    status: { type: string, enum: [scheduled, running, succeeded, failed, partial, cancelled, expired], description: Absent before Gaia takes it up }
                    change: { type: string }
                    run: { type: string }
                    results: { type: array, items: { type: object, properties: { uid: { type: string }, hostname: { type: string }, contract: { type: string }, batch: { type: integer }, result: { type: string, enum: [ok, failed, skipped, not run] }, detail: { type: string } } } }
                    updatedAt: { type: string, format: date-time }
                    finishedAt: { type: string, format: date-time }
                    action: { type: string, description: From the contract repository while the Operation is there }
                    selector: { type: string }
                    window: { type: object, properties: { start: { type: string }, end: { type: string } } }
                    notAfter: { type: string }
                    hosts: { type: array, items: { type: string } }
                    schedule: { type: string, description: The OperationSchedule that wrote it }
  /api/v1/schedules:
    get:
      summary: The contract repository's OperationSchedules and the Operations each wrote (operator)
      operationId: listSchedules
      responses:
        "200":
          description: By name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    recurrence: { type: string, description: iCalendar RRULE }
                    start: { type: string, description: "HH:MM" }
                    timezone: { type: string }
                    duration: { type: string }
                    createAhead: { type: string }
                    approval: { type: string, enum: [perInstance, once] }
                    action: { type: string }
                    selector: { type: string }
                    operations: { type: array, items: { type: string } }
        "503": { description: The server does not follow a repository }
  /api/v1/access:
    get:
      summary: The access entries of the contracts the caller may see in full (design 14.3)
      operationId: listAccess
      responses:
        "200":
          description: By contract
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    contract: { type: string }
                    group: { type: string }
                    team: { type: string }
                    sudo: { type: boolean, description: Every command }
                    commands: { type: array, items: { type: string }, description: Only these commands }
        "503": { description: The server does not follow a repository }
  /api/v1/settings:
    get:
      summary: The settings version the desired state is loaded with, and what Git still has of the settings kinds (design 17.2)
      operationId: getSettings
      responses:
        "200":
          description: The current version; Ignored is left out of the desired state
          content:
            application/json:
              schema:
                type: object
                properties:
                  store: { type: boolean, description: False when this Gaia keeps its settings in Git }
                  current: { $ref: "#/components/schemas/SettingsVersion" }
                  ignored:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, name: { type: string }, source: { type: string } } }
  /api/v1/settings/versions:
    get:
      summary: The settings versions, newest first
      operationId: listSettingsVersions
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SettingsVersion" } }
  /api/v1/settings/versions/{version}:
    get:
      summary: One settings version with its objects as written
      operationId: getSettingsVersion
      parameters:
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The version and its files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SettingsVersion"
                  - type: object
                    properties:
                      files:
                        type: array
                        items: { type: object, properties: { path: { type: string }, kind: { type: string }, yaml: { type: string } } }
        "404": { description: No such version }
  /api/v1/settings/check:
    post:
      summary: What a settings change would do, without keeping it (operator, platform-admin; design 17.3)
      operationId: checkSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { changes: { type: array, items: { $ref: "#/components/schemas/SettingsEdit" } } } }
      responses:
        "200":
          description: Errors, what it does to each object, and the contracts whose plan changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsCheck" }
        "403": { description: Not an operator or platform admin }
  /api/v1/settings/proposals:
    post:
      summary: Propose a settings change; one that does not check out is not kept (operator, platform-admin)
      operationId: proposeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, changes]
              properties:
                title: { type: string }
                reason: { type: string }
                changes: { type: array, items: { $ref: "#/components/schemas/SettingsEdit" } }
      responses:
        "201":
          description: The proposal
          content: { application/json: { schema: { $ref: "#/components/schemas/SettingsProposal" } } }
        "422":
          description: It does not check out
          content: { application/json: { schema: { type: object, properties: { error: { type: string }, check: { $ref: "#/components/schemas/SettingsCheck" } } } } }
    get:
      summary: Settings changes, newest first
      operationId: listSettingsProposals
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, applied, rejected, stale, withdrawn] } }
        - { name: awaiting, in: query, schema: { type: string, enum: [me] }, description: The pending ones the caller may decide }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Proposals
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SettingsProposal" } } } }
  /api/v1/settings/proposals/{id}:
    get:
      summary: One settings change, with each object before and after
      operationId: getSettingsProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The proposal
          content: { application/json: { schema: { $ref: "#/components/schemas/SettingsProposal" } } }
        "404": { description: No such proposal }
  /api/v1/settings/proposals/{id}/approve:
    post:
      summary: Approve a settings change for the content seen; it becomes a new settings version (step-up)
      operationId: approveSettingsProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [contentHash], properties: { contentHash: { type: string }, comment: { type: string } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsProposal" } } } }
        "403": { description: "The proposer, someone who may not decide, or no recent step-up" }
        "409": { description: "Not pending, another content, or the settings it changes changed (stale)" }
  /api/v1/settings/proposals/{id}/reject:
    post:
      summary: Reject a settings change, saying why (step-up)
      operationId: rejectSettingsProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [contentHash, comment], properties: { contentHash: { type: string }, comment: { type: string } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsProposal" } } } }
        "400": { description: No reason }
        "403": { description: May not decide }
        "409": { description: Not pending, or another content }
  /api/v1/settings/proposals/{id}/withdraw:
    post:
      summary: Take back one's own pending settings change
      operationId: withdrawSettingsProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Withdrawn, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsProposal" } } } }
        "403": { description: Not the proposer }
        "409": { description: Not pending }
  /api/v1/audit:
    get:
      summary: The audit log, newest first (platform-admin; design 17.4)
      operationId: listAudit
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: "A prefix: settings. matches every settings action" }
        - { name: object, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer }, description: Entries older than this ID, for paging }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 200 } }
        - { name: format, in: query, schema: { type: string, enum: [jsonl] }, description: One JSON object per line, for a SIEM }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
            application/x-ndjson:
              schema: { type: string }
  /api/v1/sources:
    get:
      summary: What each Source (TeamSource...) did last, the sync report (design 5.4)
      operationId: listSources
      responses:
        "200":
          description: One report per source
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string, description: Kind/name }
                    status: { type: string, enum: [unchanged, committed, refused, failed] }
                    commit: { type: string, description: Gaia's commit, when one was written }
                    detail: { type: object, description: "added, changed and removed files; problems: what was left out and why" }
                    error: { type: string }
                    ranAt: { type: string, format: date-time }
  /api/v1/catalog:
    get:
      summary: The desired catalog's objects, contracts left out (design 11.5)
      operationId: listCatalog
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: "Only objects of these kinds, comma separated" }
        - { name: spec, in: query, schema: { type: string, enum: ["1"] }, description: Add each object's spec; params are counted, not listed }
      responses:
        "200":
          description: The catalog's commit and its objects by kind and name
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit: { type: string }
                  objects: { type: array, items: { $ref: "#/components/schemas/CatalogObject" } }
        "503": { description: The server does not follow a repository }
  /api/v1/catalog/{kind}/{name}:
    get:
      summary: One catalog object, its YAML, its references and what refers to it
      operationId: getCatalogObject
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The object
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CatalogObject"
                  - type: object
                    properties:
                      annotations: { type: object, additionalProperties: { type: string } }
                      patchFiles: { type: array, items: { type: string } }
                      yaml: { type: string }
                      refs: { type: array, items: { $ref: "#/components/schemas/CatalogRef" } }
                      usedByRefs: { type: array, items: { $ref: "#/components/schemas/CatalogRef" } }
                      params:
                        type: array
                        description: "AnsibleRole and App: the params a contract may give, nested options as dotted names"
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            type: { type: string }
                            elements: { type: string }
                            required: { type: boolean }
                            default: { description: Left out for secrets }
                            choices: { type: array, items: {} }
                            description: { type: string }
                            secret: { type: boolean }
                            pattern: { type: string }
                            format: { type: string }
                            min: { type: number }
                            max: { type: number }
                            deprecated: { type: string }
                      rules:
                        type: array
                        items: { type: object, properties: { expression: { type: string }, message: { type: string } } }
                      role:
                        type: object
                        description: "AnsibleRole: where it comes from and where it runs"
                        properties:
                          provider: { type: string }
                          role: { type: string }
                          os: { type: array, items: { type: string } }
                          monitoring: { type: array, items: { type: string } }
                          conflicts: { type: array, items: { type: string } }
                          allowedEnvironments: { type: array, items: { type: string } }
                          checkMode: { type: string }
                          runbook: { type: boolean }
        "404": { description: No such object, or a contract }
  /api/v1/schema/{kind}:
    get:
      summary: A kind's spec as fields, for forms and tables
      operationId: getSchema
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The fields, content: { application/json: { schema: { $ref: "#/components/schemas/SchemaField" } } } }
        "404": { description: No such kind }
  /api/v1/providers:
    get:
      summary: The providers, where they are used and the last discovery's errors (platform-admin)
      operationId: listProviders
      responses:
        "200":
          description: Providers by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    type: { type: string }
                    endpoint: { type: string }
                    credentials: { type: string, description: "A reference (bao://…), never the secret" }
                    usedBy: { type: array, items: { $ref: "#/components/schemas/CatalogRef" } }
                    error: { type: string, description: What the last discovery got from it, if it failed }
                    check:
                      type: object
                      description: Gaia's last check (every five minutes); absent before the first
                      properties:
                        status: { type: string, enum: [ok, failed, skipped] }
                        detail: { type: string, description: "What it answered: a version, a count; for skipped, why" }
                        error: { type: string }
                        latencyMs: { type: integer }
                        checkedAt: { type: string, format: date-time }
                        lastOkAt: { type: string, format: date-time }
  /api/v1/providers/check:
    post:
      summary: Check every provider now (platform-admin)
      operationId: checkProviders
      responses:
        "202": { description: Queued; at most one check a minute }
  /api/v1/sources/sync:
    post:
      summary: Run the sources now (platform-admin)
      operationId: syncSources
      responses:
        "202": { description: Running }
        "503": { description: This server runs no sources }
  /api/v1/webhooks/github:
    post:
      summary: GitHub push webhook (public; checked with X-Hub-Signature-256)
      description: A valid push fetches the followed repositories now. Only the signature is trusted; commits are read from Git. Off (404) unless gaia server has --webhook-secret.
      operationId: githubWebhook
      security: []
      parameters:
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: ping }
        "202": { description: push; fetching }
        "204": { description: Another event, ignored }
        "401": { description: The signature does not match }
        "404": { description: Webhooks are off }
  /api/v1/auth/config:
    get:
      summary: How to sign in (public)
      operationId: authConfig
      security: []
      responses:
        "200":
          description: Methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  require: { type: string, enum: [mfa, passkey] }
                  providers: { type: array, items: { type: object, properties: { name: { type: string }, type: { type: string, enum: [oidc, local] } } } }
  /api/v1/auth/passkey/begin:
    post:
      summary: Start a passkey sign-in (public)
      operationId: passkeyBegin
      security: []
      responses:
        "200": { $ref: "#/components/responses/FlowStart" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/passkey/finish:
    post:
      summary: Finish a passkey sign-in; sets the session cookie (public)
      operationId: passkeyFinish
      security: []
      requestBody: { $ref: "#/components/requestBodies/Ceremony" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Principal" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/enroll/begin:
    post:
      summary: Start registering a passkey with an enrollment token (public)
      operationId: enrollBegin
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/FlowStart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/enroll/finish:
    post:
      summary: Keep the passkey, get recovery codes and a session (public)
      operationId: enrollFinish
      security: []
      requestBody: { $ref: "#/components/requestBodies/Ceremony" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/recovery:
    post:
      summary: Sign in with a recovery code, which is used up (public)
      operationId: recoveryLogin
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [username, code], properties: { username: { type: string }, code: { type: string } } } } } }
      responses:
        "200": { description: Signed in }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/password:
    post:
      summary: Sign in with password and a TOTP code (public; require mfa)
      operationId: passwordLogin
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [username, password, code], properties: { username: { type: string }, password: { type: string }, code: { type: string } } } } } }
      responses:
        "200": { description: Signed in }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/ldap:
    post:
      summary: Check a directory password; a pending sign-in then waits for Gaia's second factor (public; design 17.5)
      operationId: ldapLogin
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [username, password], properties: { provider: { type: string }, username: { type: string }, password: { type: string }, next: { type: string } } } } } }
      responses:
        "200": { description: "Password checked; sets the gaia_pending cookie", content: { application/json: { schema: { $ref: "#/components/schemas/SecondFactor" } } } }
        "401": { description: The username or password is wrong }
        "403": { description: "Disabled in the directory, or not in a team Gaia knows" }
        "502": { description: The directory did not answer }
  /api/v1/auth/pending:
    post:
      summary: How a pending sign-in may finish (public; needs the gaia_pending cookie)
      operationId: pendingState
      security: []
      responses:
        "200": { description: Its second factors, content: { application/json: { schema: { $ref: "#/components/schemas/SecondFactor" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/pending/passkey/begin:
    post:
      summary: The passkey step of a pending sign-in; a first sign-in registers one (public; needs the gaia_pending cookie)
      operationId: pendingPasskeyBegin
      security: []
      responses:
        "200": { description: The ceremony, content: { application/json: { schema: { type: object, properties: { flow: { type: string }, options: { type: object }, register: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/pending/passkey/finish:
    post:
      summary: Check the passkey and sign in (public; needs the gaia_pending cookie)
      operationId: pendingPasskeyFinish
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { flow: { type: string }, name: { type: string }, credential: { type: object } } } } } }
      responses:
        "200": { description: "Signed in; recovery codes after a first passkey", content: { application/json: { schema: { type: object, properties: { next: { type: string }, recoveryCodes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/pending/totp:
    post:
      summary: Finish a pending sign-in with a TOTP code (public; require mfa)
      operationId: pendingTOTP
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { type: object, properties: { next: { type: string } } } } } }
        "401": { description: The code is wrong }
        "409": { description: The account has no TOTP yet }
  /api/v1/auth/pending/totp/begin:
    post:
      summary: A first sign-in's TOTP seed, for an account with no second factor (public; require mfa)
      operationId: pendingTOTPBegin
      security: []
      responses:
        "200": { description: The seed, content: { application/json: { schema: { type: object, properties: { secret: { type: string }, uri: { type: string } } } } } }
        "409": { description: The account has a second factor already }
  /api/v1/auth/pending/totp/finish:
    post:
      summary: Confirm the first TOTP with a code, sign in, get recovery codes (public; require mfa)
      operationId: pendingTOTPFinish
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { type: object, properties: { next: { type: string }, recoveryCodes: { type: array, items: { type: string } } } } } } }
        "401": { description: The code is wrong }
        "409": { description: Start the setup again }
  /api/v1/auth/enroll/totp/begin:
    post:
      summary: Make a TOTP seed for an enrolling account (public; require mfa)
      operationId: totpBegin
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { description: The seed for an authenticator app, content: { application/json: { schema: { type: object, properties: { secret: { type: string }, uri: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/enroll/totp/finish:
    post:
      summary: Set the password, confirm the seed with a code, get recovery codes (public; require mfa)
      operationId: totpFinish
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [token, password, code], properties: { token: { type: string }, password: { type: string, minLength: 12 }, code: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/oidc/passkey/begin:
    post:
      summary: The passkey step of an OIDC sign-in that showed no MFA (public; needs the gaia_pending cookie)
      description: Answers with an assertion to make, or, for a person's first sign-in, a passkey to register (register true).
      operationId: oidcPasskeyBegin
      security: []
      responses:
        "200": { description: The ceremony, content: { application/json: { schema: { type: object, properties: { flow: { type: string }, options: { type: object }, register: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/oidc/passkey/finish:
    post:
      summary: Finish the passkey step; sets the session cookie (public)
      operationId: oidcPasskeyFinish
      security: []
      requestBody: { $ref: "#/components/requestBodies/Ceremony" }
      responses:
        "200": { description: Signed in; recoveryCodes after a first passkey, content: { application/json: { schema: { type: object, properties: { next: { type: string }, recoveryCodes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/cli/authorize:
    post:
      summary: The browser approves a CLI sign-in on this machine (browser session)
      description: Answers with the loopback address to send the one-time code to (RFC 8252). The code lives two minutes.
      operationId: cliAuthorize
      requestBody: { content: { application/json: { schema: { type: object, required: [redirectUri, state, codeChallenge], properties: { redirectUri: { type: string, description: "http://127.0.0.1:<port>/..." }, state: { type: string }, codeChallenge: { type: string, description: S256 } } } } } }
      responses:
        "200": { description: Where to go, content: { application/json: { schema: { type: object, properties: { redirect: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/cli/token:
    post:
      summary: Trade the code and the PKCE verifier for CLI tokens (public)
      operationId: cliToken
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [code, codeVerifier, redirectUri], properties: { code: { type: string }, codeVerifier: { type: string }, redirectUri: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/cli/refresh:
    post:
      summary: A new access token from the refresh token (public)
      operationId: cliRefresh
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/cli/logout:
    post:
      summary: End the CLI session of a refresh token, with its access tokens (public)
      operationId: cliLogout
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses:
        "204": { description: Ended }
  /api/v1/auth/device:
    post:
      summary: Start a device sign-in (public, RFC 8628)
      operationId: deviceStart
      security: []
      responses:
        "200":
          description: The codes
          content:
            application/json:
              schema:
                type: object
                properties: { deviceCode: { type: string }, userCode: { type: string }, verificationUri: { type: string }, interval: { type: integer }, expiresIn: { type: integer } }
  /api/v1/auth/device/token:
    post:
      summary: Poll a device sign-in (public)
      description: Errors are RFC 8628's — authorization_pending, slow_down, access_denied, expired_token, invalid_grant — in the error field of a 400.
      operationId: deviceToken
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [deviceCode], properties: { deviceCode: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/device/{code}:
    get:
      summary: Where a device sign-in comes from, to check before approving (browser session)
      operationId: deviceInfo
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The request, content: { application/json: { schema: { type: object, properties: { ip: { type: string }, userAgent: { type: string }, requestedAt: { type: string, format: date-time } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/device/{code}/approve:
    post:
      summary: Approve a device sign-in (browser session)
      operationId: deviceApprove
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Approved }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/device/{code}/deny:
    post:
      summary: Deny a device sign-in (browser session)
      operationId: deviceDeny
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Denied }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/step-up/begin:
    post:
      summary: Confirm the browser session with a passkey (step-up)
      operationId: stepUpBegin
      responses:
        "200": { $ref: "#/components/responses/FlowStart" }
  /api/v1/auth/step-up/finish:
    post:
      summary: Finish the step-up; sensitive work is allowed for 10 minutes
      operationId: stepUpFinish
      requestBody: { $ref: "#/components/requestBodies/Ceremony" }
      responses:
        "204": { description: Confirmed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/step-up/totp:
    post:
      summary: Confirm the browser session with a TOTP code, for accounts without a passkey
      operationId: stepUpTOTP
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "204": { description: Confirmed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        "204": { description: Signed out }
  /api/v1/me:
    get:
      summary: The caller, their teams and roles
      operationId: me
      responses:
        "200": { description: The caller, content: { application/json: { schema: { $ref: "#/components/schemas/Principal" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/login-keys:
    get:
      summary: Your SSH keys for logging in to servers (design 14.4)
      operationId: myLoginKeys
      responses:
        "200": { description: Live keys, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LoginKey" } } } } }
    post:
      summary: Add an SSH key for logging in to servers; needs a recent passkey or MFA
      description: Servers whose access names one of your teams get it at their next run.
      operationId: addLoginKey
      requestBody: { content: { application/json: { schema: { type: object, required: [publicKey], properties: { name: { type: string }, publicKey: { type: string } } } } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/LoginKey" } } } }
        "400": { description: Not an SSH public key }
        "403": { description: "Confirm with a passkey first (stepUp: true)" }
        "409": { description: Registered already }
  /api/v1/me/login-keys/{fingerprint}:
    delete:
      summary: Remove an SSH login key
      operationId: revokeLoginKey
      parameters: [{ name: fingerprint, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "404": { description: No such key }
  /api/v1/me/notifications:
    get:
      summary: Your email notifications (design 7.6)
      operationId: myNotifications
      responses:
        "200": { description: Address and triggers, content: { application/json: { schema: { $ref: "#/components/schemas/Notifications" } } } }
    put:
      summary: Choose the triggers you get mail for; local accounts also set their address
      description: You hear only of contracts you see in full. Leaving email out keeps it.
      operationId: setMyNotifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [triggers]
              properties:
                email: { type: string }
                triggers: { type: array, items: { type: string } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Notifications" } } } }
        "400": { description: An unknown trigger, a bad address, or an address that comes from the identity provider, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/me/sessions:
    get:
      summary: The caller's live sessions
      operationId: mySessions
      responses:
        "200": { description: Sessions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Session" } } } } }
  /api/v1/me/sessions/{id}:
    delete:
      summary: End one of the caller's sessions
      operationId: revokeMySession
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Ended }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me/passkeys:
    get:
      summary: The caller's passkeys
      operationId: myPasskeys
      responses:
        "200": { description: Passkeys, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } } } } }
  /api/v1/me/passkeys/begin:
    post:
      summary: Start adding a passkey (needs a passkey in the last 10 minutes)
      operationId: addPasskeyBegin
      responses:
        "200": { $ref: "#/components/responses/FlowStart" }
        "403": { $ref: "#/components/responses/StepUp" }
  /api/v1/me/passkeys/finish:
    post:
      summary: Keep the new passkey
      operationId: addPasskeyFinish
      requestBody: { $ref: "#/components/requestBodies/Ceremony" }
      responses:
        "204": { description: Added }
        "403": { $ref: "#/components/responses/StepUp" }
  /api/v1/me/passkeys/{id}:
    delete:
      summary: Remove a passkey; the last one cannot be removed
      operationId: deletePasskey
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/StepUp" }
        "409": { description: The last passkey, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/me/recovery-codes:
    post:
      summary: Replace the caller's recovery codes
      operationId: regenerateRecoveryCodes
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "403": { $ref: "#/components/responses/StepUp" }
  /api/v1/me/signing-keys:
    get:
      summary: The caller's commit signing keys (design 7.6)
      operationId: mySigningKeys
      responses:
        "200": { description: Keys, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SigningKey" } } } } }
    post:
      summary: Register an SSH or armored OpenPGP public key (recent passkey)
      operationId: addSigningKey
      requestBody: { content: { application/json: { schema: { type: object, required: [publicKey], properties: { name: { type: string }, publicKey: { type: string } } } } } }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/SigningKey" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/StepUp" }
  /api/v1/me/signing-keys/{fingerprint}:
    delete:
      summary: Revoke a signing key (recent passkey)
      operationId: revokeSigningKey
      parameters: [{ name: fingerprint, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/StepUp" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users:
    get:
      summary: Accounts (platform-admin)
      operationId: listUsers
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Open a local account and get its enrollment link; with a directory, a break-glass platform admin only (platform-admin; step-up)
      operationId: createUser
      requestBody: { content: { application/json: { schema: { type: object, required: [username], properties: { username: { type: string }, displayName: { type: string }, teams: { type: array, items: { type: string } }, breakGlass: { type: boolean } } } } } }
      responses:
        "201": { description: Opened, content: { application/json: { schema: { type: object, properties: { enrollUrl: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}/disable:
    post:
      summary: Disable an account and end its sessions (platform-admin)
      operationId: disableUser
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Disabled }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/enable:
    post:
      summary: Enable an account (platform-admin)
      operationId: enableUser
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Enabled }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}/enroll:
    post:
      summary: A new enrollment link for a local account (platform-admin, recent passkey)
      operationId: reenrollUser
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The link, content: { application/json: { schema: { type: object, properties: { enrollUrl: { type: string } } } } } }
        "403": { $ref: "#/components/responses/StepUp" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: gaia_session }
    bearer: { type: http, scheme: bearer, description: A CLI access token }
  requestBodies:
    Decision:
      content:
        application/json:
          schema:
            type: object
            required: [planHash]
            properties:
              planHash: { type: string, description: The plan you decide on }
              comment: { type: string, description: Required to reject }
    Ceremony:
      content:
        application/json:
          schema:
            type: object
            required: [flow, credential]
            properties:
              flow: { type: string }
              credential: { type: object, description: The browser's PublicKeyCredential as JSON }
              name: { type: string, description: A name for a new passkey }
              token: { type: string, description: The enrollment token }
  parameters:
    RunID: { name: id, in: path, required: true, schema: { type: string, examples: [run-s62emmzbvofqg3ol] } }
  responses:
    FlowStart:
      description: A ceremony to finish with the browser's WebAuthn API
      content: { application/json: { schema: { type: object, properties: { flow: { type: string }, options: { type: object } } } } }
    RecoveryCodes:
      description: Recovery codes, shown once
      content: { application/json: { schema: { type: object, properties: { recoveryCodes: { type: array, items: { type: string } } } } } }
    Unauthorized: { description: Not signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    Forbidden: { description: Not allowed, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    StepUp:
      description: Confirm with a passkey first; the body has stepUp true
      content: { application/json: { schema: { type: object, properties: { error: { type: string }, stepUp: { type: boolean } } } } }
    Tokens:
      description: CLI tokens; refresh fields only when a session starts
      content:
        application/json:
          schema:
            type: object
            properties: { accessToken: { type: string }, accessExpiresAt: { type: string, format: date-time }, refreshToken: { type: string }, refreshExpiresAt: { type: string, format: date-time } }
    TooMany: { description: Too many attempts, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    BadRequest: { description: A parameter is wrong, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    NotFound: { description: No such object, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  schemas:
    LoginKey:
      type: object
      properties:
        fingerprint: { type: string }
        name: { type: string }
        publicKey: { type: string }
        createdAt: { type: string, format: date-time }
    Notifications:
      type: object
      properties:
        email: { type: string }
        emailEditable: { type: boolean, description: Local accounts set their address; others get their identity provider's verified one }
        triggers: { type: array, items: { type: string } }
        available: { type: array, items: { type: string } }
    Problem:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Discovery:
      type: object
      properties:
        takenAt: { type: string, format: date-time }
        vms:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              id: { type: string }
              name: { type: string }
              powerState: { type: string }
              ips: { type: array, items: { type: string } }
              category: { type: string, enum: [managed, orphan, unmanaged, template] }
              uid: { type: string }
              hostname: { type: string }
              contract: { type: string }
        missing: { type: array, items: { type: object, properties: { provider: { type: string }, id: { type: string }, uid: { type: string }, hostname: { type: string }, contract: { type: string } } } }
        hosts: { type: array, items: { type: object, properties: { provider: { type: string }, name: { type: string }, uid: { type: string } } } }
        counts: { type: object, additionalProperties: { type: integer } }
        errors: { type: object, additionalProperties: { type: string } }
    Drift:
      type: object
      description: A live drift report; the details only for those who see the contract in full.
      properties:
        contract: { type: string }
        uid: { type: string }
        hostname: { type: string }
        area: { type: string, enum: [registration, provisioning, configuration] }
        key: { type: string, description: "What differs: monitoring/enabled, dns/a..." }
        want: { type: string }
        got: { type: string }
        status: { type: string, enum: [open, unknown] }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        change: { type: string, description: The change that puts it right }
        restricted: { type: boolean }
    Change:
      type: object
      required: [id, contract, source, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        contract: { type: string }
        source: { type: string, enum: [commit, retry, revert, drift, drift-auto, operation, schedule] }
        status: { type: string, enum: [pending, approved, running, applied, failed, cancelled, rejected, superseded, expired] }
        label: { type: string, description: The snapshot's commits }
        planHash: { type: string }
        requestedBy: { type: array, items: { type: string }, description: Who signed the commits it brings }
        commits:
          type: array
          items: { type: object, properties: { repo: { type: string }, commit: { type: string }, signer: { type: string }, problem: { type: string } } }
        gates:
          type: array
          items:
            type: object
            properties:
              gate: { type: string, enum: [validation, signature, approval, window] }
              status: { type: string, enum: [ok, waiting, failed] }
              detail: { type: object, description: "approval: groups with candidates and approvedBy, and the excluded signers" }
        approvals:
          type: array
          items: { type: object, properties: { username: { type: string }, decision: { type: string, enum: [approve, reject] }, planHash: { type: string }, comment: { type: string }, createdAt: { type: string, format: date-time } } }
        plan: { type: object }
        snapshot: { type: object }
        runId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        awaitingMe: { type: boolean, description: The caller may give an approval the change still waits for }
        restricted: { type: boolean }
    Principal:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        session: { type: string }
        sessionKind: { type: string, enum: [ui, cli-access] }
        teams: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string, enum: [viewer, operator, platform-admin] } }
        strongAuthAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [ui, cli-refresh] }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ip: { type: string }
        userAgent: { type: string }
    Passkey:
      type: object
      properties: { id: { type: string }, name: { type: string }, createdAt: { type: string, format: date-time }, lastUsedAt: { type: string, format: date-time } }
    SigningKey:
      type: object
      properties:
        fingerprint: { type: string, description: "SHA256:… for SSH keys, upper-case hex for OpenPGP" }
        kind: { type: string, enum: [ssh, gpg] }
        name: { type: string }
        publicKey: { type: string }
        createdAt: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        provider: { type: string }
        enabled: { type: boolean }
        teams: { type: array, items: { type: string } }
        directory: { type: boolean, description: From the directory; changed there }
        breakGlass: { type: boolean, description: A local account while people sign in with the directory }
    Run:
      type: object
      required: [id, contracts, commit, planHash, status, queuedAt]
      properties:
        id: { type: string }
        contracts: { type: array, items: { type: string } }
        commit: { type: string }
        planHash: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        error: { type: string }
        requestedBy: { type: string }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        configCommit: { type: string, description: The Ansible repository's commit the run used }
        eeImage: { type: string, description: The execution environment image, by digest }
        change: { type: string, description: The change the run applies (detail only) }
        hosts: { type: object, additionalProperties: { type: string }, description: "UID → hostname of the servers its events name (detail only)" }
        stages: { type: array, items: { $ref: "#/components/schemas/Stage" } }
        restricted: { type: boolean, description: The caller sees the run's contracts by name only; details are left out }
        record:
          type: object
          required: [seq, recordHash, prevHash]
          properties: { seq: { type: integer }, recordHash: { type: string }, prevHash: { type: string }, archived: { type: string } }
    Stage:
      type: object
      required: [contract, stage, status, startedAt]
      properties:
        contract: { type: string, description: Empty for stages of the whole run }
        stage: { type: string, enum: [ipam, restore, decommission, deregister, provision, release, register, configure, access, record, operation] }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        detail: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Event:
      type: object
      required: [seq, stage, type, createdAt]
      properties:
        seq: { type: integer }
        stage: { type: string }
        type: { type: string, description: '"log" for an output line, else an ansible-runner event' }
        host: { type: string, description: Server UID }
        task: { type: string }
        changed: { type: boolean }
        failed: { type: boolean }
        stdout: { type: string, description: Secrets masked }
        data: { type: object, description: ansible-runner event_data, secrets masked }
        createdAt: { type: string, format: date-time }
    CatalogObject:
      type: object
      required: [kind, name, source, usedBy]
      properties:
        kind: { type: string }
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        source: { type: string, description: "file:line in the platform repository" }
        generatedBy: { type: string, description: The Source that wrote it }
        patches: { type: integer }
        usedBy: { type: integer, description: How many objects refer to it }
        contracts: { type: integer, description: How many of those are contracts }
        spec: { type: object, description: "With ?spec=1: the spec without params" }
        params: { type: integer, description: "With ?spec=1: how many params it takes" }
    SettingsVersion:
      type: object
      properties:
        version: { type: integer }
        author: { type: string, description: "A username, gaia, or source/<name>" }
        reason: { type: string }
        proposal: { type: string }
        contentHash: { type: string }
        createdAt: { type: string, format: date-time }
        objects: { type: integer }
    SchemaField:
      type: object
      properties:
        key: { type: string }
        type: { type: string, enum: [string, int, float, bool, object, list, map, any] }
        required: { type: boolean }
        enum: { type: array, items: { type: string } }
        ref: { type: string, description: The kind a string field names an object of }
        fields: { type: array, items: { $ref: "#/components/schemas/SchemaField" } }
        items: { $ref: "#/components/schemas/SchemaField" }
    SecondFactor:
      type: object
      properties:
        require: { type: string, enum: [passkey, mfa] }
        username: { type: string }
        passkey: { type: boolean, description: The account has a passkey }
        totp: { type: boolean, description: The account has a TOTP }
    SettingsEdit:
      type: object
      description: "An object to add or change (yaml), or to remove (kind, name, delete)"
      properties:
        yaml: { type: string }
        kind: { type: string }
        name: { type: string }
        delete: { type: boolean }
    SettingsObjectChange:
      type: object
      properties:
        kind: { type: string }
        name: { type: string }
        path: { type: string }
        op: { type: string, enum: [add, change, remove] }
        before: { type: string }
        after: { type: string }
    SettingsCheck:
      type: object
      properties:
        base: { type: integer, description: The settings version it was checked against }
        contentHash: { type: string }
        objects: { type: array, items: { $ref: "#/components/schemas/SettingsObjectChange" } }
        errors: { type: array, items: { type: string } }
        impact: { type: array, items: { type: object, properties: { contract: { type: string }, error: { type: string } } } }
        critical: { type: boolean, description: Only a platform admin decides }
        whyCritical: { type: array, items: { type: string } }
    SettingsProposal:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, applied, rejected, stale, withdrawn] }
        baseVersion: { type: integer }
        contentHash: { type: string }
        requestedBy: { type: string }
        critical: { type: boolean }
        whyCritical: { type: array, items: { type: string } }
        impact: { type: array, items: { type: object, properties: { contract: { type: string }, error: { type: string } } } }
        paths: { type: array, items: { type: string } }
        decidedBy: { type: string }
        comment: { type: string }
        appliedVersion: { type: integer }
        staleReason: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        mayDecide: { type: boolean }
        why: { type: string, description: Why the caller may not decide }
        objects: { type: array, items: { $ref: "#/components/schemas/SettingsObjectChange" } }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        actorId: { type: string }
        sessionId: { type: string }
        address: { type: string }
        action: { type: string }
        object: { type: string }
        result: { type: string, enum: [ok, denied, failed] }
        detail: { type: object }
    CatalogRef:
      type: object
      properties:
        kind: { type: string }
        name: { type: string }
        field: { type: string }
    ContractSummary:
      type: object
      required: [name, liveHosts]
      properties:
        name: { type: string }
        liveHosts: { type: integer }
        lastRun: { type: string }
        lastStatus: { type: string }
        sync: { type: string, enum: [synced, out-of-sync, unknown] }
        openChange: { type: string }
        labels: { type: object, additionalProperties: { type: string }, description: The Server object's labels in Git }
        appliedLabel: { type: string, description: The commits it was last applied at }
        appliedAt: { type: string, format: date-time }
        restricted: { type: boolean }
    Contract:
      type: object
      required: [name, hosts, runs]
      properties:
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        state:
          type: object
          description: How Gaia last found it against Git, and what was last applied
          properties:
            sync: { type: string, enum: [synced, out-of-sync, unknown] }
            error: { type: string, description: Why the sync is unknown }
            evaluatedAt: { type: string, format: date-time }
            appliedLabel: { type: string }
            appliedPlanHash: { type: string }
            appliedAt: { type: string, format: date-time }
            appliedPlan: { type: object, description: The plan last applied }
        openChange: { type: string }
        hosts: { type: array, items: { $ref: "#/components/schemas/Host" } }
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
    Host:
      type: object
      required: [uid, hostname, site, network, status, externalIds]
      properties:
        uid: { type: string }
        hostname: { type: string }
        site: { type: string }
        network: { type: string }
        status: { type: string }
        externalIds: { type: object, additionalProperties: { type: string }, description: provider/kind to ID }
