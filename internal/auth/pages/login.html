<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia · Giriş</title>
<script src="/auth/gaia-auth.js" defer></script>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#F6F7F9;color:#14171C">
<main style="max-width:380px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #E1E5EB;border-radius:8px">
<h1 style="margin:0 0 4px;font-size:24px">gaia</h1>
<p id="intro" style="margin:0 0 24px;color:#566070">Passkey'inizle giriş yapın.</p>
<div id="providers" style="display:grid;gap:8px;margin-bottom:12px"></div>
<button id="step" type="button" hidden style="width:100%;height:44px;border:0;border-radius:6px;background:#1F4FC8;color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-bottom:12px">Gaia passkey'inizle onaylayın</button>
<button id="passkey" type="button" style="width:100%;height:44px;border:0;border-radius:6px;background:#1F4FC8;color:#fff;font:inherit;font-weight:600;cursor:pointer">Passkey ile giriş</button>
<form id="password" hidden style="margin-top:16px">
<p style="margin:0;color:#566070">veya parola ve doğrulama kodu ile:</p>
<label style="display:block;margin:8px 0">Kullanıcı adı <input name="username" autocomplete="username" required style="width:100%;height:36px;box-sizing:border-box"></label>
<label style="display:block;margin:8px 0">Parola <input name="password" type="password" autocomplete="current-password" required style="width:100%;height:36px;box-sizing:border-box"></label>
<label style="display:block;margin:8px 0">Doğrulama kodu <input name="code" inputmode="numeric" autocomplete="one-time-code" required style="width:100%;height:36px;box-sizing:border-box"></label>
<button type="submit" style="height:40px">Giriş</button>
</form>
<p id="error" role="alert" style="color:#B3261E;min-height:1.5em"></p>
<details style="margin-top:16px">
<summary style="cursor:pointer;color:#566070">Kurtarma kodu ile giriş</summary>
<form id="recovery" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
<label style="display:block;margin:8px 0">Kullanıcı adı <input name="username" autocomplete="username" required style="width:100%;height:36px;box-sizing:border-box"></label>
<label style="display:block;margin:8px 0">Kurtarma kodu <input name="code" autocomplete="one-time-code" required style="width:100%;height:36px;box-sizing:border-box"></label>
<button type="submit" style="height:40px">Giriş</button>
</form>
</details>
<section id="codes" hidden>
<h2 style="font-size:18px">Kurtarma kodları</h2>
<p style="color:#566070">Her biri bir kez kullanılır. Güvenli bir yere kaydedin; bir daha gösterilmeyecek.</p>
<pre id="codelist" style="background:#F6F7F9;padding:12px;border-radius:6px;font-size:15px"></pre>
<a id="codes-next" href="/">Devam et</a>
</section>
</main>
</body>
</html>
