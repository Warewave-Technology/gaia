<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia · Değişiklik onayı</title>
<script src="/auth/gaia-auth.js" defer></script>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#F6F7F9;color:#14171C">
<main id="approve-page" style="max-width:720px;margin:6vh auto;padding:32px;background:#fff;border:1px solid #E1E5EB;border-radius:8px">
<h1 style="margin:0 0 4px;font-size:24px">Değişiklik <span id="change-contract"></span></h1>
<p style="margin:0 0 16px;color:#566070"><span id="change-id"></span> · <span id="change-status"></span> · plan <code id="change-plan"></code></p>
<h2 style="font-size:16px;margin:24px 0 8px">Sunucular</h2>
<table id="change-servers" style="width:100%;border-collapse:collapse;font-size:14px"></table>
<h2 style="font-size:16px;margin:24px 0 8px">Commit'ler</h2>
<ul id="change-commits" style="font-size:14px;padding-left:20px;margin:0"></ul>
<h2 style="font-size:16px;margin:24px 0 8px">Gereksinimler</h2>
<ul id="change-gates" style="font-size:14px;padding-left:20px;margin:0"></ul>
<section id="decide" hidden style="margin-top:24px">
<label style="display:block;margin:8px 0">Not <textarea id="comment" rows="3" style="width:100%;box-sizing:border-box;font:inherit"></textarea></label>
<button id="approve" type="button" style="height:44px;border:0;border-radius:6px;background:#1F4FC8;color:#fff;font:inherit;font-weight:600;padding:0 18px;cursor:pointer">Onayla</button>
<button id="reject" type="button" style="height:44px;border:1px solid #C6CCD5;border-radius:6px;background:#fff;font:inherit;font-weight:600;padding:0 18px;cursor:pointer">Reddet</button>
<p style="color:#566070;font-size:13px">Onay sadece yukarıdaki plan için geçerlidir; plan değişirse yeniden onay gerekir.</p>
</section>
<form id="stepup-totp" hidden style="margin-top:16px">
<label style="display:block;margin:8px 0">Doğrulama kodu <input name="code" inputmode="numeric" autocomplete="one-time-code" required style="height:36px"></label>
<button type="submit" style="height:40px">Doğrula</button>
</form>
<p id="error" role="alert" style="color:#B3261E;min-height:1.5em"></p>
<p id="done" hidden style="color:#17703F"></p>
</main>
</body>
</html>
