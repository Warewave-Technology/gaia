<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia · Cihaz girişi</title>
<script src="/auth/gaia-auth.js" defer></script>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#F6F7F9;color:#14171C">
<main style="max-width:420px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #E1E5EB;border-radius:8px">
<h1 style="margin:0 0 4px;font-size:24px">Cihaz girişi</h1>
<p style="margin:0 0 16px;color:#566070">Terminalde gösterilen kodu girin. Kodu siz istemediyseniz onaylamayın.</p>
<form id="device-form">
<label style="display:block;margin:8px 0">Kod <input name="code" autocomplete="off" required style="width:100%;height:36px;box-sizing:border-box;text-transform:uppercase"></label>
<button type="submit" style="height:40px">Devam</button>
</form>
<section id="device-check" hidden style="margin-top:16px">
<p>İstek <strong id="device-ip"></strong> adresinden, <span id="device-time"></span> geldi.</p>
<p style="color:#566070;font-size:13px" id="device-agent"></p>
<button id="device-approve" type="button" style="height:44px;border:0;border-radius:6px;background:#1F4FC8;color:#fff;font:inherit;font-weight:600;padding:0 18px;cursor:pointer">Onayla</button>
<button id="device-deny" type="button" style="height:44px;border:1px solid #C6CCD5;border-radius:6px;background:#fff;font:inherit;font-weight:600;padding:0 18px;cursor:pointer">Reddet</button>
</section>
<p id="error" role="alert" style="color:#B3261E;min-height:1.5em"></p>
<p id="done" hidden style="color:#17703F"></p>
</main>
</body>
</html>
