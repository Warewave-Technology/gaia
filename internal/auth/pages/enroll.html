<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia · Hesabı etkinleştir</title>
<script src="/auth/gaia-auth.js" defer></script>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#F6F7F9;color:#14171C">
<main style="max-width:420px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #E1E5EB;border-radius:8px">
<h1 style="margin:0 0 4px;font-size:24px">Hesabı etkinleştir</h1>
<p style="margin:0 0 24px;color:#566070">Bu cihazda bir passkey oluşturun. Gaia'ya bundan sonra onunla girersiniz.</p>
<label style="display:block;margin-bottom:12px">Passkey adı <input id="name" placeholder="ör. iş dizüstü" style="width:100%;height:36px;box-sizing:border-box"></label>
<button id="enroll" type="button" style="width:100%;height:44px;border:0;border-radius:6px;background:#1F4FC8;color:#fff;font:inherit;font-weight:600;cursor:pointer">Passkey oluştur</button>
<p id="error" role="alert" style="color:#B3261E;min-height:1.5em"></p>
<section id="codes" hidden>
<h2 style="font-size:18px">Kurtarma kodları</h2>
<p style="color:#566070">Her biri bir kez kullanılır. Güvenli bir yere kaydedin; bir daha gösterilmeyecek.</p>
<pre id="codelist" style="background:#F6F7F9;padding:12px;border-radius:6px;font-size:15px"></pre>
<a href="/">Devam et</a>
</section>
</main>
</body>
</html>
