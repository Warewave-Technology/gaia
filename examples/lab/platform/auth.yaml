apiVersion: gaia/v1alpha1
kind: AuthConfig
metadata:
  name: default
spec:
  # Passkey'ler güvenli bir bağlam ister (https veya localhost). Lab'de
  # Gaia'ya SSH tüneliyle localhost üzerinden girilir:
  #   ssh -L 8080:127.0.0.1:8080 labadm@192.168.1.26
  url: http://localhost:8080
  require: passkey
  providers:
    - name: local
      type: local
      purpose: break-glass
  sessions:
    ui:  { ttl: 8h, idle: 30m }
    cli: { accessTtl: 1h, refreshTtl: 12h }
