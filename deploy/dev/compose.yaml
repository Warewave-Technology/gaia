# Gaia'nın yerel geliştirme ortamı. Sırlar sabit ve sadece yerel kullanım için.
#   make dev-up      ortamı kurar ve başlangıç ayarlarını yapar
#   make dev-down    kapatır ve verileri siler
name: gaia-dev

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: gaia_owner
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gaia
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gaia_owner", "-d", "gaia"]
      interval: 2s
      retries: 30

  # Dev modunda: bellekte, mühürsüz, root token "dev-root".
  openbao:
    image: docker.io/openbao/openbao:2.7.1
    command: ["server", "-dev", "-dev-root-token-id=dev-root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:18200:8200"]

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=256"]
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:18333:8333"]

  # OIDC sağlayıcısı (isteğe bağlı: make dev-oidc). Realm gaia-dev, istemci gaia,
  # kullanıcılar ayse (team-platform) ve mehmet (team-web).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [oidc]
    command: ["start-dev", "--import-realm", "--http-port=18081", "--hostname=http://localhost:18081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:18081:18081"]

  # Git sunucusu (isteğe bağlı: make dev-git). GitHub yerine uçtan uca test için:
  # ssh ile fetch/push ve X-Hub-Signature-256 imzalı webhook. Yönetici gaia-admin / dev-git-password.
  gitea:
    image: docker.io/gitea/gitea:1.24.6
    profiles: [git]
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:13000/
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      GITEA__server__SSH_PORT: "12222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    ports: ["127.0.0.1:13000:3000", "127.0.0.1:12222:22"]

  # E-posta yakalayıcı (isteğe bağlı: make dev-mail): SMTP 127.0.0.1:11025, gelen kutusu
  # http://localhost:18025. Bildirimlerin uçtan uca testi için.
  mailpit:
    image: docker.io/axllent/mailpit:v1.27.3
    profiles: [mail]
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]

  # Başlangıç ayarları: OpenBao (kv, transit, AppRole) ve S3 bucket'ları.
  init:
    image: docker.io/library/alpine:3.22
    depends_on:
      postgres: { condition: service_healthy }
      openbao: { condition: service_started }
      seaweedfs: { condition: service_started }
    volumes:
      - ./init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
