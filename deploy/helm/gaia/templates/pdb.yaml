{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gaia.fullname" . }}
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "gaia.selector" . | nindent 6 }}
      gaia.dev/api: "true"
{{- end }}
