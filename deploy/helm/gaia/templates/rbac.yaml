{{- if .Values.ansible.rbac }}
# Ansible runs are pods of their own (design 13.3): the workers may run
# and remove pods in this namespace, and read their logs; nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gaia.fullname" . }}-ansible
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gaia.fullname" . }}-ansible
  labels:
    {{- include "gaia.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gaia.fullname" . }}-ansible
subjects:
  - kind: ServiceAccount
    name: {{ include "gaia.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
