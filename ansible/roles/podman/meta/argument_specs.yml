---
argument_specs:
  main:
    short_description: podman'ı kurar; isterseniz API soketini ve container'ların açılışta geri gelmesini açar
    options:
      api_socket:
        type: bool
        default: true
        description: podman.socket açık olsun (Docker uyumlu API, /run/podman/podman.sock).
      restart_containers:
        type: bool
        default: true
        description: podman-restart servisi açık olsun; restart-policy always olan container'lar açılışta başlar.
      extra_packages:
        type: list
        elements: str
        default: []
        description: Ek paketler (ör. buildah, skopeo). EPEL paketleri için EPEL baseline'da açık olmalı.
