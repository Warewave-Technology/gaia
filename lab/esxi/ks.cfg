# ESXi 8 unattended install for the Gaia lab (nested on Proxmox).
# __ROOT_PASSWORD__ is replaced by remaster-iso.sh; never commit a real password.
vmaccepteula
install --firstdisk --overwritevmfs
rootpw __ROOT_PASSWORD__
network --bootproto=dhcp --device=vmnic0
reboot

%firstboot --interpreter=busybox
# SSH on, so the lab can be inspected and automated after install.
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1
